{% extends "base.html" %}

{% block content %}
    <h1 class="mb-4">Relatórios Mensais</h1>

    <div class="card">
        <div class="card-body">
            <form action="/relatorios/gerar" method="post">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Máquina:</label>
                        <select name="maquina_id" class="form-select" required>
                            {% for m in maquinas %}
                            <option value="{{ m.id }}">{{ m.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Mês:</label>
                        <select name="mes" class="form-select" required>
                            {% for i in range(1, 13) %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Ano:</label>
                        <input type="number" name="ano" class="form-control" value="2026" required>
                    </div>
                    <div class="col-md-2 mb-3 d-grid">
                        <label class="form-label">&nbsp;</label>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-file-earmark-pdf"></i> Gerar PDF</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
