<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniRoute - Gestão de Frota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #0d6efd; --dark-bg: #212529; }
        body { background-color: #f8f9fa; }
        .sidebar { background: #212529; color: white; min-height: 100vh; }
        .navbar-brand { font-weight: bold; color: var(--primary-color) !important; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); border-radius: 0.5rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-truck"></i> LH RENTAL MANUTENÇÃO</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/maquinas"><i class="bi bi-gear"></i> Máquinas</a>
                <a class="nav-link" href="/mecanicos"><i class="bi bi-people"></i> Mecânicos</a>
                <a class="nav-link" href="/relatorios"><i class="bi bi-file-earmark-text"></i> Relatórios</a>
            </div>
        </div>
    </nav>
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
